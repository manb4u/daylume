<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>daylume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{
  --bg:#F2EEE5; --surface:#FBF9F4; --ink:#151515; --muted:#77736A; --faint:#A9A498;
  --line:rgba(21,21,21,.10); --line-strong:#151515;
  --red:#DE3B26; --yellow:#F3B415; --blue:#1F4FA8; --grey:#BDB7AA; --cloud-dark:#59584F; --snow:#FFFFFF;
  --t-clear:#FAEBBE; --t-partly:#E4E9F0; --t-cloudy:#E8E4DB; --t-fog:#ECE9E2; --t-rain:#DBE3F1; --t-snow:#F1F4F8; --t-storm:#F5DAD3; --t-none:transparent; --t-heavy:#DCE6F3; --t-sleet:#E1E6EE; --snowcap:#FFFFFF; --moon-dark:rgba(21,21,21,.07);
  --ice-top:rgba(255,255,255,.9); --ice-bottom:rgba(212,226,244,.92); --ice-line:rgba(31,79,168,.07); --ice-glint:rgba(255,255,255,.8); --pg-body:#151515; --pg-edge:transparent;
  --sand-top:#F4E2B6; --sand-bottom:#E7C98A; --sand-dot:rgba(150,108,40,.28); --sand-edge:#D9B263; --road-top:#55545A; --road-bottom:#3E3D42; --road-dash:#F1E6C4; --road-edge:#8D8B84;
  --floor-top:#DDBF92; --floor-bottom:#C69C68; --floor-seam:rgba(96,62,28,.28); --floor-edge:#A97E4C;
  --water-top:#6F98DA; --water-bottom:#2F5DB0; --water-glint:rgba(255,255,255,.55); --rain:rgba(31,79,168,.45); --fog:rgba(255,255,255,.72);
  --hero-ink:#151515; --shadow:0 30px 80px rgba(20,18,12,.18);
  --scrim:rgba(242,238,229,.72);
  --glass:rgba(251,249,244,.66); --glass-edge:rgba(255,255,255,.7); --sheet-scrim:rgba(20,18,12,.32);
}
[data-theme="dark"]{
  --bg:#0F1013; --surface:#16171B; --ink:#EFEBE2; --muted:#8C8981; --faint:#5C5A55;
  --line:rgba(239,235,226,.09); --line-strong:#EFEBE2;
  --red:#E8553F; --yellow:#F2C232; --blue:#5584E0; --grey:#6A6C74; --cloud-dark:#3B3D44; --snow:#E9EEF6;
  --t-clear:#2E2814; --t-partly:#1C2130; --t-cloudy:#1F2024; --t-fog:#1D1E21; --t-rain:#141D33; --t-snow:#1B2029; --t-storm:#321915; --t-heavy:#1E2A3F; --t-sleet:#192030; --snowcap:#2B3647; --moon-dark:rgba(239,235,226,.08);
  --ice-top:rgba(196,216,244,.18); --ice-bottom:rgba(120,152,204,.12); --ice-line:rgba(233,238,246,.07); --ice-glint:rgba(255,255,255,.14); --pg-body:#15171c; --pg-edge:rgba(239,235,226,.35);
  --sand-top:#5A4C30; --sand-bottom:#43381F; --sand-dot:rgba(255,230,170,.12); --sand-edge:#8C7440; --road-top:#2C2D33; --road-bottom:#1F2025; --road-dash:#BFB79E; --road-edge:#4A4B52;
  --floor-top:#4C3D2B; --floor-bottom:#3A2E20; --floor-seam:rgba(0,0,0,.38); --floor-edge:#6E5636;
  --water-top:#24427A; --water-bottom:#162A52; --water-glint:rgba(200,220,255,.35); --rain:rgba(160,190,255,.45); --fog:rgba(190,198,212,.16);
  --hero-ink:#EFEBE2; --shadow:0 30px 80px rgba(0,0,0,.55);
  --scrim:rgba(10,11,13,.72);
  --glass:rgba(32,33,38,.6); --glass-edge:rgba(255,255,255,.09); --sheet-scrim:rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font,"Plus Jakarta Sans",system-ui,sans-serif);-webkit-font-smoothing:antialiased;transition:background .6s,color .6s;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.app{display:grid;grid-template-columns:320px 1fr;grid-template-rows:72px minmax(0,1fr);height:100vh}

/* Header */
header{grid-column:1/-1;display:flex;align-items:center;gap:20px;padding:0 28px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;width:271px;flex-shrink:0}   /* puts the Today button's edge on the sidebar divider */
.logo{display:flex;align-items:center;gap:3px}
.logo i{display:block;width:16px;height:16px}
.logo .c{background:var(--yellow);border-radius:50%}
.logo .s{background:var(--red)}
.logo .t{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid var(--blue)}
.brand b{font-family:"Outfit","Jost",sans-serif;font-weight:500;font-size:23px;letter-spacing:-.035em;line-height:1}
.btn{height:38px;padding:0 18px;border:1px solid var(--line-strong);border-radius:999px;font-size:14px;font-weight:500;letter-spacing:.02em;transition:background .2s,color .2s}
.btn:hover{background:var(--ink);color:var(--bg)}
.nav{display:flex;gap:2px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;transition:background .2s}
.icon-btn:hover{background:var(--line)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.month-title{font-size:26px;font-weight:400;letter-spacing:-.01em;white-space:nowrap}
.month-title span{color:var(--muted);font-weight:300}
.spacer{flex:1}
.search{position:relative}
.search input{height:38px;width:240px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 38px 0 38px;font-size:14px;outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--ink)}
.search-clear{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s}
.search-clear:hover{background:var(--line);color:var(--ink)}
.search-clear svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none}
.search-clear[hidden]{display:none}
.search>svg{position:absolute;left:14px;top:11px;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.results{position:absolute;top:44px;left:0;width:360px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;z-index:30;box-shadow:var(--shadow)}
.results button{display:block;width:100%;text-align:left;padding:10px 16px;font-size:14px}
.results button:hover{background:var(--line)}
.results small{color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{height:30px;min-width:38px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.mode-chip{display:flex;align-items:center;gap:10px;height:38px;padding:0 14px 0 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.mode-chip .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.mode-chip em{font-style:normal;color:var(--muted)}

/* Sidebar */
aside{padding:28px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:28px;overflow:auto;scrollbar-width:none}
.label{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.place{font-size:22px;font-weight:500;line-height:1.15;margin-top:6px}
.place small{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:4px}
.now{display:grid;grid-template-columns:1fr auto;align-items:end;gap:8px;cursor:pointer}
.now .temp{font-size:96px;font-weight:300;line-height:.85;letter-spacing:-.05em}
.now .temp sup{font-size:40px;vertical-align:top;position:relative;top:6px;letter-spacing:0}
.now .cond{grid-column:1/-1;font-size:18px;font-weight:500;margin-top:14px}
.now .meta{grid-column:1/-1;font-size:14px;color:var(--muted);display:flex;gap:14px}
.sunarc svg{width:100%;height:auto;display:block}
.sunarc .row{display:flex;justify-content:space-between;font-size:13px;margin-top:6px}
.sunarc .row b{display:block;font-weight:500;font-size:15px}
.sunarc .row span{color:var(--muted)}
.sunarc .mnote{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--muted)}
.sunarc .mnote b{color:var(--ink);font-weight:500}
.sunarc .mnote svg{width:14px;height:14px;flex-shrink:0}
.week{display:flex;flex-direction:column}
.week button{display:grid;grid-template-columns:44px 30px 1fr 60px;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);text-align:left;font-size:14px}
.week button:hover .wd{color:var(--red)}
.week .wd{font-weight:500}
.week .bar{height:4px;border-radius:2px;background:var(--line);position:relative}
.week .bar i{position:absolute;top:0;bottom:0;border-radius:2px;background:var(--ink)}
.week .tt{text-align:right;font-variant-numeric:tabular-nums}
.week .tt span{color:var(--muted)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;font-size:13px;color:var(--muted)}
.legend div{display:flex;align-items:center;gap:8px}

/* Calendar */
main{display:flex;flex-direction:column;min-width:0;padding:0 0 0 0}
.dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.dow div{padding:12px 14px;font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--muted)}
.grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,minmax(0,1fr));min-height:0}
.cell{position:relative;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 12px 12px;display:flex;flex-direction:column;text-align:left;transition:background .25s;min-width:0;overflow:hidden}
.cell:nth-child(7n){border-right:0}
.cell:hover{background:var(--surface)}
.cell .d{font-size:14px;font-weight:500;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;margin:-3px 0 0 -6px}
.cell.out .d{color:var(--faint)}
.cell.out .wx{opacity:.35}
.cell.today .d{background:var(--red);color:#fff}
.cell.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cell .wx{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.cell .ic{position:absolute;right:10px;top:10px;width:58px;height:58px}
.cell .tmax{font-size:30px;font-weight:400;line-height:1;letter-spacing:-.03em}
.cell .tmin{font-size:15px;color:var(--muted);font-weight:400;letter-spacing:0;margin-left:4px}
.cell .c{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:8px}
.cell .c .p{color:var(--blue);font-weight:500}
.cell .tint{position:absolute;left:0;right:0;bottom:0;height:4px}
.cell.nodata .wx{justify-content:flex-end}
.cell.nodata .c{color:var(--faint)}
.hatch{position:absolute;right:12px;top:12px;width:46px;height:46px;border-radius:50%;border:1.5px dashed var(--faint);opacity:.6}
.cell.out.nodata .hatch{opacity:.25}

/* Focus view */
.focus{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:32px;background:var(--scrim);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s}
.focus.open{opacity:1;pointer-events:auto}
.sheet{width:min(1120px,100%);max-height:calc(100vh - 64px);overflow:auto;background:var(--surface);border-radius:28px;box-shadow:var(--shadow);display:grid;grid-template-columns:440px 1fr;transform:translateY(12px) scale(.985);transition:transform .3s}
.focus.open .sheet{transform:none}
.hero{position:relative;padding:32px;display:flex;flex-direction:column;min-height:640px;color:var(--hero-ink);border-radius:28px 0 0 28px;overflow:hidden}
.hero .date{font-size:15px;font-weight:500;letter-spacing:.02em}
.hero .date span{display:block;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.6;margin-bottom:4px}
.hero .art{flex:1;display:grid;place-items:center;padding:12px 0}
.hero .art svg{width:300px;height:300px}
.hero .word{font-size:64px;font-weight:600;line-height:.9;letter-spacing:-.02em;text-transform:uppercase}
.hero .desc{font-size:16px;opacity:.7;margin-top:10px}
.hero .desc-m{display:none}   /* phone-only short description */
.hero .temps{display:flex;align-items:baseline;gap:16px;margin-top:22px;font-weight:300}
.hero .temps b{font-size:56px;font-weight:300;letter-spacing:-.04em;line-height:1}
.hero .temps span{font-size:24px;opacity:.6}
.detail{padding:28px 32px 32px;display:flex;flex-direction:column;gap:26px;min-width:0}
.dhead{display:flex;align-items:center;gap:6px}
.dhead .t{flex:1;font-size:13px;color:var(--muted)}
.dhead .t-m{display:none}   /* phone-only title: place · date */
.close{border:1px solid var(--line)}
.chart{background:var(--bg);border-radius:20px;padding:18px 18px 10px}
.chart svg{width:100%;height:auto;display:block}
.chart .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.chart .top .k{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.chart .top .k i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--bg);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-height:118px}
.stat .h{display:flex;justify-content:space-between;align-items:center}
.stat .v{font-size:30px;font-weight:400;letter-spacing:-.02em;line-height:1}
.stat .v small{font-size:15px;color:var(--muted);margin-left:3px;letter-spacing:0}
.stat .s{font-size:13px;color:var(--muted);margin-top:auto}
.stat .meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:auto}
.stat .meter i{display:block;height:100%}
.nodata-msg{padding:48px;text-align:center;color:var(--muted)}

.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:80;transition:opacity .4s}
.loading.gone{opacity:0;pointer-events:none}
.loading .logo i{width:22px;height:22px;animation:bob 1.2s ease-in-out infinite}
.loading .logo .t{border-left-width:12px;border-right-width:12px;border-bottom-width:22px}
.loading .logo i:nth-child(2){animation-delay:.15s}.loading .logo i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-8px)}}
.err{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:90}


/* Day view scenes: a ground band at the bottom of the hero with a small Bauhaus penguin scene per weather type */
.hero.has-scene{padding-bottom:calc(var(--band) + 72px)}   /* leaves a clear lane above the line for the penguin */
.hero.has-scene>:not(.band):not(.fx){position:relative;z-index:1}
.band{position:absolute;left:0;right:0;bottom:0;z-index:1;display:flex;align-items:center;padding:0 32px;border-top:2px solid var(--blue)}
.band.ice{background:repeating-linear-gradient(60deg,transparent 0 14px,var(--ice-line) 14px 15px),repeating-linear-gradient(-60deg,transparent 0 22px,var(--ice-line) 22px 23px),linear-gradient(180deg,var(--ice-top),var(--ice-bottom));
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.band.ice::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;background:linear-gradient(180deg,var(--ice-glint),transparent);pointer-events:none}
.band.sand{border-top-color:var(--sand-edge);background:radial-gradient(circle,var(--sand-dot) 0 1px,transparent 1.5px) 0 0/9px 9px,radial-gradient(circle,var(--sand-dot) 0 .8px,transparent 1.3px) 4px 5px/13px 11px,linear-gradient(180deg,var(--sand-top),var(--sand-bottom))}
.band.road{border-top-color:var(--road-edge);background:linear-gradient(180deg,var(--road-top),var(--road-bottom))}
.band.road::before{content:"";position:absolute;left:0;right:0;top:15px;height:3px;background:repeating-linear-gradient(90deg,var(--road-dash) 0 26px,transparent 26px 52px)}
.band.floor{border-top-color:var(--floor-edge);background:linear-gradient(var(--floor-seam),var(--floor-seam)) 0 50%/100% 1px no-repeat,repeating-linear-gradient(90deg,transparent 0 79px,var(--floor-seam) 79px 80px) 0 0/100% 50% no-repeat,repeating-linear-gradient(90deg,transparent 0 79px,var(--floor-seam) 79px 80px) 40px 100%/100% 50% no-repeat,linear-gradient(180deg,var(--floor-top),var(--floor-bottom))}
.band.water{background:linear-gradient(180deg,var(--water-top),var(--water-bottom))}
.band.water::before,.band.water::after{content:"";position:absolute;left:0;right:0;height:2px;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 18px,var(--water-glint) 18px 34px,transparent 34px 60px)}
.band.water::before{top:10px}
.band.water::after{top:24px;opacity:.6;background:repeating-linear-gradient(90deg,transparent 0 30px,var(--water-glint) 30px 44px,transparent 44px 84px)}
.band .ripple{position:absolute;top:-4px;width:26px;height:8px;margin-left:-13px;border:1.5px solid var(--water-glint);border-radius:50%;opacity:0}
.ice-val{position:relative;display:flex;align-items:baseline;gap:5px;color:var(--hero-ink)}
.band.road .ice-val,.band.water .ice-val{color:#F7F4EC}
.ice-val b{font-size:34px;font-weight:300;letter-spacing:-.03em;line-height:1}
.ice-val small{font-size:14px;opacity:.7}
.ice-val span{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.6;margin-left:10px}
.fx{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.fx-rain{transform:skewX(-10deg);transform-origin:top}
.fx-rain i{position:absolute;top:0;width:1.5px;height:100%;background:linear-gradient(180deg,var(--rain) 0 16px,transparent 16px);opacity:0}
.fx-fog i{position:absolute;left:-50%;width:200%;height:110px;margin-top:-55px;background:radial-gradient(ellipse 50% 50% at 50% 50%,var(--fog),transparent 70%) 0 0/50% 100% repeat-x;filter:blur(3px)}
.fx-flash{background:#FFFFFF;opacity:0}
.penguin .pw-skel,.penguin .pw-bolt,.penguin .pw-sparks,.penguin .cr-puff{opacity:0}
@media (prefers-reduced-motion:no-preference){
  .walker{animation:pg-run 26s linear infinite}
  .walker.storm{animation:pg-run-storm 16s linear infinite}
  .penguin .pw-body{transform-origin:31px 54px;animation:pg-waddle .75s ease-in-out infinite alternate}
  .penguin .pw-fa{animation:pg-step .75s ease-in-out infinite alternate}
  .penguin .pw-fb{animation:pg-step .75s ease-in-out -.75s infinite alternate}
  .penguin .zz{animation:pg-zz 3.6s ease-out infinite}
  .penguin .zz.z2{animation-delay:-1.2s}
  .penguin .zz.z3{animation-delay:-2.4s}
  .penguin .pb-breathe{transform-origin:31px 50.5px;animation:pg-breathe 3.4s ease-in-out infinite}
  .penguin .pb-feet{transform-origin:47px 50px;animation:pg-tap 1.8s ease-in-out infinite}
  .penguin .pb-glint{animation:pg-glint 4.5s ease-in-out infinite}
  .boat{animation:pg-run 30s linear infinite}
  .penguin .bt-bob{transform-origin:36px 52px;animation:pg-rock 2.6s ease-in-out infinite}
  .penguin .bt-umb{transform-origin:34px 36px;animation:pg-sway 1.8s ease-in-out infinite alternate}
  .penguin .bt-wake{animation:pg-wake 1.2s ease-out infinite}
  .car{animation:pg-drive 15s linear infinite}
  .penguin .cr-body{animation:pg-bounce .45s ease-in-out infinite alternate}
  .penguin .cr-wheel{animation:pg-spin .6s linear infinite}
  .penguin .cr-puff{animation:pg-puff 1.4s ease-out infinite}
  .penguin .pw-norm{animation:pg-norm 16s linear infinite}
  .penguin .pw-skel{animation:pg-skel 16s linear infinite}
  .penguin .pw-bolt{animation:pg-bolt 16s linear infinite}
  .penguin .pw-shock{animation:pg-shock 16s linear infinite}
  .penguin .pw-sparks{animation:pg-sparks 16s linear infinite}
  .fx-flash{animation:pg-flash 16s linear infinite}
  .fx-rain i{animation:pg-rain var(--d,.9s) linear var(--dl,0s) infinite}
  .fx-fog i{animation:pg-fog var(--d,24s) linear infinite}
  .band .ripple{animation:pg-ripple 1.8s ease-out var(--dl,0s) infinite}
  .band.water::before{animation:pg-glide 6s linear infinite}
  .band.water::after{animation:pg-glide2 9s linear infinite reverse}
}
@keyframes pg-run{from{left:calc(100% + 10px)}to{left:-70px}}
/* storm: walks in, stops when the bolt strikes, flickers between penguin and skeleton, walks off as a skeleton */
@keyframes pg-run-storm{0%{left:calc(100% + 10px)}44%{left:44%}54%{left:44%}100%{left:-70px}}
@keyframes pg-waddle{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes pg-step{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}

@keyframes pg-spin{to{transform:rotate(360deg)}}
@keyframes pg-puff{0%{transform:translate(0,0) scale(.6);opacity:.55}100%{transform:translate(-14px,-6px) scale(1.7);opacity:0}}
@keyframes pg-norm{0%,45%{opacity:1}45.8%{opacity:0}46.6%{opacity:1}47.4%{opacity:0}48.2%{opacity:1}49%,99.4%{opacity:0}100%{opacity:1}}
@keyframes pg-skel{0%,45%{opacity:0}45.8%{opacity:1}46.6%{opacity:0}47.4%{opacity:1}48.2%{opacity:0}49%,99.4%{opacity:1}100%{opacity:0}}
@keyframes pg-bolt{0%,44.6%,100%{opacity:0}45%{opacity:1}45.6%{opacity:.2}46.2%{opacity:1}47.2%{opacity:0}}

@keyframes pg-shock{0%,45%,53%,100%{transform:translate(0,0)}46%{transform:translate(-1.2px,.6px)}47%{transform:translate(1.4px,-.8px)}48%{transform:translate(-1px,-.4px)}49%{transform:translate(1.2px,.8px)}50%{transform:translate(-.8px,.4px)}51%{transform:translate(1px,-.6px)}52%{transform:translate(-.6px,.3px)}}

@media (prefers-reduced-motion:no-preference){
  .penguin.skier{animation:pg-run 18s linear infinite}
  .penguin .pg-glide{animation:pg-surge 1.3s ease-in-out infinite}
  .penguin .pg-torso{animation:pg-crouch 1.3s ease-in-out infinite}
  .penguin .pg-arm{animation:pg-arm 1.3s ease-in-out infinite}
  .penguin .pg-pole{animation:pg-pole 1.3s ease-in-out infinite}
  .penguin .pg-scarf-tail{animation:pg-flutter .32s ease-in-out infinite alternate}
  .penguin .pg-spray circle{animation:pg-spray .65s linear infinite}
  .penguin .pg-spray circle:nth-child(2){animation-delay:-.22s}
  .penguin .pg-spray circle:nth-child(3){animation-delay:-.44s}
}
/* skiing right to left; each double-pole push gives a small surge of speed */

@keyframes pg-surge{0%,100%{transform:translateX(0)}50%{transform:translateX(-3px)}}
/* double poling: plant forward (upright) → crouch and push back → recover */
@keyframes pg-crouch{0%{transform:translateY(0.0px) rotate(-4deg)}25%{transform:translateY(1.5px) rotate(-10deg)}45%{transform:translateY(2.6px) rotate(-14deg)}55%{transform:translateY(2.2px) rotate(-12deg)}80%{transform:translateY(0.0px) rotate(-3deg)}100%{transform:translateY(0.0px) rotate(-4deg)}}
/* two joints: the flipper turns at the shoulder, the pole turns at the hand so its tip stays planted during the push */
@keyframes pg-arm{0%{transform:rotate(70.7deg)}25%{transform:rotate(28.7deg)}45%{transform:rotate(-21.6deg)}55%{transform:rotate(-28.2deg)}80%{transform:rotate(71.7deg)}100%{transform:rotate(70.7deg)}}
@keyframes pg-pole{0%{transform:translate(23.42px,30.35px) rotate(-19.5deg)}25%{transform:translate(28.78px,34.69px) rotate(-39.6deg)}45%{transform:translate(37.96px,39.50px) rotate(-46.5deg)}55%{transform:translate(38.86px,37.94px) rotate(-60.3deg)}80%{transform:translate(25.11px,29.61px) rotate(27.4deg)}100%{transform:translate(23.42px,30.35px) rotate(-19.5deg)}}
@keyframes pg-flutter{from{transform:rotate(-7deg)}to{transform:rotate(9deg) scaleX(1.08)}}
@keyframes pg-spray{0%{transform:translate(0,0);opacity:.55}100%{transform:translate(9px,-5px);opacity:0}}
/* Range: history + outlook */
.icon-btn:disabled{opacity:.28;cursor:default;background:none}
.cell.next{background-image:repeating-linear-gradient(135deg,transparent 0 9px,var(--line) 9px 10px)}
/* Weather icon micro-motion: on hover in day cells, always looping for today and in the focused day view */
:is(.ic, .hero .art) svg *{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
  :is(.cell:is(:hover,:focus-visible) .ic, .cell.today .ic, .hero .art) .a-sun{animation:wx-pulse 1.8s ease-in-out infinite}
  :is(.cell:is(:hover,:focus-visible) .ic, .cell.today .ic, .hero .art) .a-core{animation:wx-core 1.8s ease-in-out infinite}
  :is(.cell:is(:hover,:focus-visible) .ic, .cell.today .ic, .hero .art) .a-ring{animation:wx-ring 1.8s ease-out infinite}
  :is(.cell:is(:hover,:focus-visible) .ic, .cell.today .ic, .hero .art) .a-moon{animation:wx-rock 2.4s ease-in-out infinite;transform-origin:right center}
  :is(.cell:is(:hover,:focus-visible) .ic, .cell.today .ic, .hero .art) .a-twinkle{animation:wx-twinkle 1.4s ease-in-out infinite;animation-delay:calc(var(--i,0) * -.7s)}
  :is(.cell:is(:hover,:focus-visible) .ic, .cell.today .ic, .hero .art) .a-peek{animation:wx-peek 2s ease-in-out infinite}
  :is(.cell:is(:hover,:focus-visible) .ic, .cell.today .ic, .hero .art) .a-drift-r{animation:wx-drift-r 2.4s ease-in-out infinite}
  :is(.cell:is(:hover,:focus-visible) .ic, .cell.today .ic, .hero .art) .a-drift-l{animation:wx-drift-l 2.4s ease-in-out infinite}
  :is(.cell:is(:hover,:focus-visible) .ic, .cell.today .ic, .hero .art) .a-bob{animation:wx-bob 1.6s ease-in-out infinite}
  :is(.cell:is(:hover,:focus-visible) .ic, .cell.today .ic, .hero .art) .a-drop{animation:wx-drop .9s linear infinite;animation-delay:calc(var(--i,0) * -.3s)}
  :is(.cell:is(:hover,:focus-visible) .ic, .cell.today .ic, .hero .art) .a-flake{animation:wx-flake 1.8s linear infinite;animation-delay:calc(var(--i,0) * -.37s)}
  :is(.cell:is(:hover,:focus-visible) .ic, .cell.today .ic, .hero .art) .a-bolt{animation:wx-bolt 1.3s steps(1,end) infinite}
  :is(.cell:is(:hover,:focus-visible) .ic, .cell.today .ic, .hero .art) .a-fog{animation:wx-fog 2.2s ease-in-out infinite}
}

<script>
(() => {
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const SNAP = params.has('snap');

const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

const S = {
  switcher: false, sum: {},
  saved: [],
  loc: null, data: null, days: {}, todayKey: null,
  view: null, selected: null,
  unit: params.get('unit') || store.get('wc.unit') || 'C',
  themePref: params.get('theme') || (SNAP ? 'auto' : (store.get('wc.theme') || 'auto')),
  set: Object.assign({ wind:'kmh', time:'24', week:'mon', outlook:true, scenes:true, motion:true, showSun:true, showWeek:true, showLegend:true, palette:'bauhaus', font:'jakarta' },
    SNAP ? {} : (store.get('wc.settings') || {})),
};

const PLACES = { berlin:{name:'Berlin',region:'Germany',lat:52.52,lon:13.405}, tokyo:{name:'Tokyo',region:'Japan',lat:35.6895,lon:139.6917},
  ny:{name:'New York',region:'United States',lat:40.7143,lon:-74.006}, reykjavik:{name:'Reykjavík',region:'Iceland',lat:64.1355,lon:-21.8954},
  capetown:{name:'Cape Town',region:'South Africa',lat:-33.9258,lon:18.4232}, paris:{name:'Paris',region:'France',lat:48.8534,lon:2.3488},
  sydney:{name:'Sydney',region:'Australia',lat:-33.8678,lon:151.2073}, dubai:{name:'Dubai',region:'United Arab Emirates',lat:25.0772,lon:55.3093} };
S.saved = params.has('saved') ? params.get('saved').split(',').map(k => PLACES[k]).filter(Boolean) : (SNAP ? [] : (store.get('wc.saved') || []));

/* ---------- Weather model ---------- */
const WMO = {0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Rime fog',
  51:'Light drizzle',53:'Drizzle',55:'Dense drizzle',56:'Freezing drizzle',57:'Freezing drizzle',
  61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',
  71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Rain showers',81:'Rain showers',82:'Violent showers',
  85:'Snow showers',86:'Heavy snow showers',95:'Thunderstorm',96:'Thunderstorm, hail',99:'Thunderstorm, hail'};
function cat(code){
  if (code == null) return 'none';
  if (code <= 1) return 'clear';
  if (code === 2) return 'partly';
  if (code === 3) return 'cloudy';
  if (code === 45 || code === 48) return 'fog';
  if ([56,57,66,67].includes(code)) return 'sleet';
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return 'rain';
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'snow';
  if (code >= 95) return 'storm';
  return 'cloudy';
}
const WORD = {clear:'Sunny', partly:'Partly cloudy', cloudy:'Cloudy', fog:'Foggy', rain:'Rainy', snow:'Snow', sleet:'Sleet', storm:'Storm', none:'—'};
const sevOf = code => [75,86].includes(code) ? 3 : code === 73 ? 2 : 1;
const SNOWW = ['Snow','Light snow','Snow','Heavy snow'];
const dayWord = d => d.c === 'snow' ? SNOWW[d.sev] : WORD[d.c];
const dayShort = d => d.c === 'snow' ? SNOWW[d.sev] : SHORT[d.c];
const capH = d => Math.round(Math.min(4 + d.snow*1.8, 24));
const tintOf = d => d.c === 'snow' && d.sev === 3 ? 'heavy' : d.c;
const SHORT = {clear:'Sunny', partly:'Partly', cloudy:'Cloudy', fog:'Fog', rain:'Rain', snow:'Snow', sleet:'Sleet', storm:'Storm', none:''};
const word = (c, day=true) => (c === 'clear' && !day) ? 'Clear' : WORD[c];

/* ---------- Bauhaus icons (pure geometry) ---------- */
// Six-armed snowflake; branch ticks only when it is big enough to read.
function flake(x, y, r, color, sw = 3, branches = r >= 9, attrs = ''){
  let d = '';
  for (let k = 0; k < 6; k++){
    const a = Math.PI/2 + k*Math.PI/3, ex = x + r*Math.cos(a), ey = y - r*Math.sin(a);
    d += `M${x} ${y}L${ex.toFixed(2)} ${ey.toFixed(2)}`;
    if (branches){
      const bx = x + r*0.62*Math.cos(a), by = y - r*0.62*Math.sin(a), t = r*0.32;
      [a + Math.PI/4, a - Math.PI/4].forEach(b => d += `M${bx.toFixed(2)} ${by.toFixed(2)}L${(bx + t*Math.cos(b)).toFixed(2)} ${(by - t*Math.sin(b)).toFixed(2)}`);
    }
  }
  return `<path ${attrs} d="${d}" stroke="${color}" stroke-width="${branches ? sw*0.8 : sw}" stroke-linecap="butt" fill="none"/>`;
}
function icon(c, day = true, sev = 2){
  const Y='var(--yellow)', R='var(--red)', B='var(--blue)', G='var(--grey)', D='var(--cloud-dark)', I='var(--ink)', W='var(--snow)';
  const fl = (x, y, r, sw, i) => flake(x, y, r, B, sw, undefined, `class="a-flake" style="--i:${i}"`);
  const drop = (x, y, i) => `<path class="a-drop" style="--i:${i}" d="M${x} ${y} l8 0 l-6 20 l-8 0 Z" fill="${B}"/>`;
  let g = '';
  switch(c){
    case 'clear':
      g = day
        ? `<circle class="a-ring" cx="50" cy="50" r="34" fill="none" stroke="${Y}" stroke-width="3" opacity="0"/><circle class="a-sun" cx="50" cy="50" r="34" fill="${Y}"/><circle class="a-core" cx="50" cy="50" r="10" fill="${R}"/>`
        : `<path class="a-moon" d="M50 14 A36 36 0 0 0 50 86 Z" fill="${Y}"/><circle class="a-twinkle" cx="72" cy="30" r="5" fill="${I}"/><rect class="a-twinkle" style="--i:1" x="66" y="62" width="10" height="10" fill="${R}"/>`;
      break;
    case 'partly':
      g = (day ? `<circle class="a-peek" cx="62" cy="38" r="24" fill="${Y}"/>` : `<path class="a-peek" d="M62 14 A24 24 0 0 0 62 62 Z" fill="${Y}"/>`)
        + `<g class="a-drift-r"><path d="M14 76 A22 22 0 0 1 58 76 Z" fill="${G}"/><rect x="14" y="76" width="64" height="10" fill="${G}"/><path d="M40 76 A19 19 0 0 1 78 76 Z" fill="${G}"/></g>`;
      break;
    case 'cloudy':
      g = `<path class="a-drift-l" d="M10 66 A24 24 0 0 1 58 66 Z" fill="${D}"/><g class="a-drift-r"><path d="M36 66 A28 28 0 0 1 92 66 Z" fill="${G}"/><rect x="10" y="66" width="82" height="12" fill="${G}"/></g>`;
      break;
    case 'fog':
      g = `<circle class="a-sun" cx="50" cy="42" r="26" fill="${Y}" opacity=".9"/><rect class="a-fog" x="12" y="44" width="76" height="8" fill="${G}"/><rect class="a-fog" style="--dx:-7px" x="22" y="58" width="66" height="8" fill="${G}"/><rect class="a-fog" style="--dx:9px" x="12" y="72" width="54" height="8" fill="${G}"/>`;
      break;
    case 'rain':
      g = `<g class="a-bob"><path d="M12 52 A26 26 0 0 1 64 52 Z" fill="${G}"/><path d="M40 52 A24 24 0 0 1 88 52 Z" fill="${D}"/><rect x="12" y="52" width="76" height="6" fill="${D}"/></g>`
        + [24,46,68].map((x,i) => drop(x, 66+(i%2)*4, i)).join('');
      break;
    case 'snow': {
      const cl = sev === 3 ? D : G;
      const flakes = sev === 1 ? [[32,75,12],[68,75,12]] : sev === 2 ? [[28,70,9.5],[72,70,9.5],[50,77,9.5],[30,93,6],[70,93,6]] : [[22,66,6.5],[42,66,6.5],[62,66,6.5],[82,66,6.5],[32,80,6.5],[52,80,6.5],[72,80,6.5],[42,94,6.5],[62,94,6.5]];
      g = `<g class="a-bob"><path d="M12 50 A26 26 0 0 1 64 50 Z" fill="${G}"/><path d="M40 50 A24 24 0 0 1 88 50 Z" fill="${cl}"/><rect x="12" y="50" width="76" height="6" fill="${cl}"/></g>`
        + flakes.map(([x,y,r], i) => fl(x, y, r, sev === 3 ? 2.6 : 3, i)).join('');
      break; }
    case 'sleet':
      g = `<g class="a-bob"><path d="M12 50 A26 26 0 0 1 64 50 Z" fill="${G}"/><path d="M40 50 A24 24 0 0 1 88 50 Z" fill="${D}"/><rect x="12" y="50" width="76" height="6" fill="${D}"/></g>`
        + drop(26, 64, 0) + fl(50, 74, 9, 3, 1) + drop(68, 64, 2) + fl(38, 93, 6, 2.6, 3) + fl(62, 93, 6, 2.6, 4);
      break;
    case 'storm':
      g = `<g class="a-bob"><path d="M10 52 A26 26 0 0 1 62 52 Z" fill="${D}"/><path d="M38 52 A26 26 0 0 1 90 52 Z" fill="${D}"/><rect x="10" y="52" width="80" height="6" fill="${D}"/></g><path class="a-bolt" d="M52 58 L36 80 L50 80 L42 98 L66 72 L52 72 L60 58 Z" fill="${R}"/>`;
      break;
    default:
      g = `<circle cx="50" cy="50" r="30" fill="none" stroke="var(--faint)" stroke-width="2" stroke-dasharray="4 5"/>`;
  }
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${g}</svg>`;
}

/* ---------- Moon (phase and illumination) ----------
   Low-precision lunar/solar position formulas (Meeus; same model as SunCalc), good to a few minutes. */
const MOON = (() => {
  const rad = Math.PI/180, dayMs = 864e5, J1970 = 2440588, J2000 = 2451545, e = rad*23.4397;
  const toDays = ms => ms/dayMs - 0.5 + J1970 - J2000;
  const ra = (l,b) => Math.atan2(Math.sin(l)*Math.cos(e) - Math.tan(b)*Math.sin(e), Math.cos(l));
  const dec = (l,b) => Math.asin(Math.sin(b)*Math.cos(e) + Math.cos(b)*Math.sin(e)*Math.sin(l));
  function sun(d){
    const M = rad*(357.5291 + 0.98560028*d);
    // longitude of perihelion advances 1.71946°/century against the equinox of date (the moon terms are of date too)
    const L = M + rad*(1.9148*Math.sin(M) + 0.02*Math.sin(2*M) + 0.0003*Math.sin(3*M)) + rad*(102.9372 + 1.71946*d/36525) + Math.PI;
    return { dec: dec(L,0), ra: ra(L,0), lon: L };
  }
  // Moon with the main periodic terms (Meeus ch. 47): evection, variation, annual equation, reduction to the ecliptic
  function moon(d){
    const L = rad*(218.316 + 13.176396*d), Mm = rad*(134.963 + 13.064993*d), F = rad*(93.272 + 13.229350*d);
    const D = rad*(297.850 + 12.190749*d), Ms = rad*(357.529 + 0.98560028*d), s = Math.sin, c = Math.cos;
    const l = L + rad*(6.289*s(Mm) + 1.274*s(2*D - Mm) + 0.658*s(2*D) + 0.214*s(2*Mm) - 0.186*s(Ms) - 0.114*s(2*F)
              + 0.059*s(2*D - 2*Mm) + 0.057*s(2*D - Ms - Mm) + 0.053*s(2*D + Mm) + 0.046*s(2*D - Ms) - 0.041*s(Ms - Mm) - 0.035*s(D) - 0.030*s(Mm + Ms));
    const b = rad*(5.128*s(F) + 0.281*s(Mm + F) + 0.278*s(Mm - F) + 0.173*s(2*D - F) + 0.055*s(2*D - Mm + F) + 0.046*s(2*D - Mm - F) + 0.033*s(2*D + F) + 0.017*s(2*Mm + F));
    const dist = 385001 - 20905*c(Mm) - 3699*c(2*D - Mm) - 2956*c(2*D) - 570*c(2*Mm) + 246*c(2*Mm - 2*D) - 205*c(Ms - 2*D) - 171*c(Mm + 2*D) - 152*c(Mm + Ms - 2*D);
    return { ra: ra(l,b), dec: dec(l,b), dist, lon: l };
  }
  // fraction lit 0..1 (from the sun–moon angle); phase 0..1 from the elongation in ecliptic longitude:
  // 0 = new, .25 = first quarter, .5 = full, .75 = last quarter
  function illumination(ms){
    const d = toDays(ms), s = sun(d), m = moon(d), sdist = 149598000;
    const phi = Math.acos(Math.sin(s.dec)*Math.sin(m.dec) + Math.cos(s.dec)*Math.cos(m.dec)*Math.cos(s.ra - m.ra));
    const inc = Math.atan2(sdist*Math.sin(phi), m.dist - sdist*Math.cos(phi));
    const ang = Math.atan2(Math.cos(s.dec)*Math.sin(s.ra - m.ra), Math.sin(s.dec)*Math.cos(m.dec) - Math.cos(s.dec)*Math.sin(m.dec)*Math.cos(s.ra - m.ra));
    const phase = (((m.lon - s.lon) / (2*Math.PI)) % 1 + 1) % 1;
    return { fraction: (1 + Math.cos(inc))/2, phase };
  }
  function phaseName(p){
    const q = 0.5/29.53;   // within ±12 h of the exact quarter
    if (p < q || p > 1 - q) return 'New moon';
    if (Math.abs(p - .25) < q) return 'First quarter';
    if (Math.abs(p - .5) < q) return 'Full moon';
    if (Math.abs(p - .75) < q) return 'Last quarter';
    return p < .25 ? 'Waxing crescent' : p < .5 ? 'Waxing gibbous' : p < .75 ? 'Waning gibbous' : 'Waning crescent';
  }
  // Next instant (searching forward) when the phase reaches `target` (0 = new, .5 = full)
  function next(ms, target){
    const f = t => { const p = illumination(t).phase; return ((p - target + 1.5) % 1) - 0.5; };  // signed distance, wraps
    let t = ms, prev = f(t);
    for (let i = 1; i <= 32*4; i++){
      const t2 = ms + i*6*3600e3, cur = f(t2);
      if (prev < 0 && cur >= 0){ let lo = t, hi = t2; for (let k = 0; k < 30; k++){ const mid = (lo+hi)/2; if (f(mid) < 0) lo = mid; else hi = mid; } return hi; }
      t = t2; prev = cur;
    }
    return null;
  }
  return { illumination, phaseName, next };
})();
// Moon disc at its real phase: lit limb on the right while waxing (left in the southern hemisphere)
function moonDisc(cx, cy, r, f, waxing, south){
  let s = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--moon-dark)" stroke="var(--faint)" stroke-width="1.5"/>`;
  if (f >= 0.985) return s + `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--yellow)"/>`;
  if (f <= 0.015) return s;
  const right = waxing !== south, gib = f > 0.5, rx = (r*Math.abs(1 - 2*f)).toFixed(2);
  const top = `${cx} ${cy - r}`, bot = `${cx} ${cy + r}`;
  return s + `<path d="M${top} A${r} ${r} 0 0 ${right ? 1 : 0} ${bot} A${rx} ${r} 0 0 ${right === gib ? 1 : 0} ${top} Z" fill="var(--yellow)"/>`;
}
function moonBlock(now, today){
  const off = S.data.utc_offset_seconds, nowMs = Date.parse(now + ':00Z') - off*1000;
  const il = MOON.illumination(nowMs), name = MOON.phaseName(il.phase), waxing = il.phase < 0.5, south = +S.loc.lat < 0;
  const lit = Math.round(il.fraction*100);
  // next full or new moon (skip the one we're in)
  const nf = MOON.next(nowMs, 0.5), nn = MOON.next(nowMs, 0);
  const nextIsFull = name === 'Full moon' ? false : name === 'New moon' ? true : nf < nn, nt = nextIsFull ? nf : nn;
  const ndKey = new Date(nt + off*1000).toISOString().slice(0,10), nd = parseKey(ndKey);
  const inDays = Math.round((Date.parse(ndKey) - Date.parse(now.slice(0,10))) / 864e5);
  const ntxt = `${inDays === 0 ? 'today' : inDays === 1 ? 'tomorrow' : 'in ' + inDays + ' days'} · ${WD[nd.getUTCDay()].slice(0,3)} ${nd.getUTCDate()} ${MONTHS[nd.getUTCMonth()].slice(0,3)}`;
  // The arc belongs to the sun: at night it stays dashed, and the moon (at its real phase) sits above the horizon.
  return `<div class="sunarc moon">
      <div class="label" style="margin-bottom:10px">Moon · ${name}</div>
      <svg viewBox="0 -6 280 148" role="img" aria-label="${name}, ${lit}% illuminated">
        <line x1="0" y1="130" x2="280" y2="130" stroke="var(--line-strong)" stroke-width="1.5"/>
        <path d="M20 130 A120 120 0 0 1 260 130" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="3 6"/>
        ${moonDisc(140, 82, 24, il.fraction, waxing, south)}
        <rect x="14" y="124" width="12" height="12" fill="var(--red)"/>
        <path d="M254 136 L266 136 L260 124 Z" fill="var(--blue)"/>
      </svg>
      <div class="row"><div><span>Sunrise</span><b>${hm(today.sunrise)}</b></div><div style="text-align:center"><span>Illuminated</span><b>${lit}%</b></div><div style="text-align:right"><span>Sunset</span><b>${hm(today.sunset)}</b></div></div>
      <div class="mnote"><svg width="14" height="14" viewBox="0 0 28 28">${moonDisc(14, 14, 12, nextIsFull ? 1 : 0, true, false)}</svg><span>${nextIsFull ? 'Full' : 'New'} moon <b>${ntxt}</b></span></div>
    </div>`;
}

/* ---------- Helpers ---------- */
const pad = n => String(n).padStart(2,'0');
const keyOf = (y,m,d) => { const t = new Date(Date.UTC(y,m,d)); return t.toISOString().slice(0,10); };
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); };
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const tconv = c => S.unit === 'F' ? c*9/5+32 : c;
const T = c => c == null ? '–' : Math.round(tconv(c)) + '°';
// Clock time in the chosen format (24-hour or 12-hour)
const clock = hhmm => { if (S.set.time === '24') return hhmm; const [h, m] = hhmm.split(':').map(Number); return `${h % 12 || 12}:${pad(m)} ${h < 12 ? 'AM' : 'PM'}`; };
const hm = iso => iso ? clock(iso.slice(11,16)) : '–';
const windU = kmh => { const k = kmh ?? 0; return S.set.wind === 'mph' ? [Math.round(k*0.621371), 'mph'] : S.set.wind === 'ms' ? [Math.round(k/3.6), 'm/s'] : [Math.round(k), 'km/h']; };
const localNowIso = () => (SNAP && params.get('at')) ? params.get('at') : S.data ? new Date(Date.now() + S.data.utc_offset_seconds*1000).toISOString().slice(0,16) : null;

/* ---------- Data ---------- */
async function getJSON(u){ const r = await fetch(u); if (!r.ok) throw new Error(r.status); const j = await r.json(); if (j.error) throw new Error(j.reason); return j; }
const isoDay = (d, add = 0) => { const t = new Date(d); t.setUTCDate(t.getUTCDate() + add); return t.toISOString().slice(0,10); };
const DAILY_CORE = 'weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,daylight_duration,precipitation_sum,snowfall_sum,wind_speed_10m_max,wind_direction_10m_dominant';
// Live forecast: last 3 days + 16 days ahead, with hourly detail and probabilities.
function fetchWeather(loc){
  return getJSON('https://api.open-meteo.com/v1/forecast?' + new URLSearchParams({
    latitude: loc.lat, longitude: loc.lon, timezone: 'auto', past_days: 3, forecast_days: 16,
    current: 'temperature_2m,apparent_temperature,weather_code,is_day,relative_humidity_2m,wind_speed_10m',
    hourly: 'temperature_2m,weather_code,precipitation_probability,precipitation,is_day',
    daily: DAILY_CORE + ',precipitation_probability_max,uv_index_max' }));
}
// One year of recorded weather (ERA5 reanalysis archive).
function fetchArchive(loc){
  const now = new Date();
  return getJSON('https://archive-api.open-meteo.com/v1/archive?' + new URLSearchParams({
    latitude: loc.lat, longitude: loc.lon, timezone: 'auto', start_date: isoDay(now, -366), end_date: isoDay(now, -2),
    hourly: 'temperature_2m,weather_code,precipitation,is_day', daily: DAILY_CORE }));
}
// 35-day ensemble (GFS, control + 30 members) for the outlook beyond the 16-day forecast.
function fetchEnsemble(loc){
  return getJSON('https://ensemble-api.open-meteo.com/v1/ensemble?' + new URLSearchParams({
    latitude: loc.lat, longitude: loc.lon, timezone: 'auto', models: 'gfs05', forecast_days: 35,
    daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum,wind_speed_10m_max,wind_direction_10m_dominant,sunrise,sunset' }));
}
const secsBetween = (a, b) => (Date.parse(b + ':00Z') - Date.parse(a + ':00Z')) / 1000;
function indexSource(data, src){
  const days = {}, d = data.daily, h = data.hourly, v = (arr, i) => arr ? arr[i] ?? null : null;
  d.time.forEach((k,i) => {
    if (d.temperature_2m_max[i] == null) return;
    days[k] = { key:k, src, code:d.weather_code[i], c:cat(d.weather_code[i]), sev:sevOf(d.weather_code[i]), tmax:d.temperature_2m_max[i], tmin:d.temperature_2m_min[i],
      sunrise:d.sunrise[i], sunset:d.sunset[i], daylight:v(d.daylight_duration,i) ?? secsBetween(d.sunrise[i], d.sunset[i]), psum:v(d.precipitation_sum,i) ?? 0,
      pprob:v(d.precipitation_probability_max,i), wind:v(d.wind_speed_10m_max,i), wdir:v(d.wind_direction_10m_dominant,i), uv:v(d.uv_index_max,i), snow:v(d.snowfall_sum,i) ?? 0, hours:[] };
  });
  if (h) h.time.forEach((t,i) => { const day = days[t.slice(0,10)]; if (day) day.hours.push({ t, temp:h.temperature_2m[i], code:h.weather_code[i], pp:v(h.precipitation_probability,i), mm:v(h.precipitation,i), day:h.is_day[i] }); });
  return days;
}
function indexEnsemble(e, fromKey, toKey){
  const d = e.daily, days = {}, keys = Object.keys(d);
  const series = name => keys.filter(k => k === name || k.startsWith(name + '_member'));
  const mean = a => a.reduce((x,y) => x+y, 0) / a.length, med = a => { const s = [...a].sort((x,y) => x-y); return s[Math.floor(s.length/2)]; };
  d.time.forEach((k,i) => {
    if (k < fromKey || k > toKey) return;
    const vals = name => series(name).map(m => d[m][i]).filter(x => x != null);
    const tx = vals('temperature_2m_max'), tn = vals('temperature_2m_min'), pr = vals('precipitation_sum'), sn = vals('snowfall_sum');
    if (!tx.length) return;
    const pprob = Math.round(pr.filter(x => x >= 1).length / pr.length * 100), snow = med(sn), psum = med(pr);
    // The control run's weather code alone is noisy at this range, so let the members vote on precipitation.
    let code = d.weather_code[i];
    if (pprob >= 50) code = snow >= 0.2 ? (snow >= 3 ? 73 : 71) : 61;
    else if (pprob < 30 && cat(code) !== 'clear' && cat(code) !== 'partly') code = 3;
    days[k] = { key:k, src:'outlook', code, c:cat(code), sev:sevOf(code), tmax:mean(tx), tmin:mean(tn), members:{ tx, tn }, runs: tx.length,
      psum, pprob, snow, sunrise:d.sunrise[i], sunset:d.sunset[i], daylight:secsBetween(d.sunrise[i], d.sunset[i]),
      wind:d.wind_speed_10m_max?.[i] ?? null, wdir:d.wind_direction_10m_dominant?.[i] ?? null, uv:null, hours:[] };

}
const cache = {};   // per location: archive + ensemble change slowly, so keep them for 6 hours
async function cached(kind, loc, fn){
  const id = kind + locId(loc), hit = cache[id];
  if (hit && Date.now() - hit.at < 6*3600e3) return hit.data;
  const data = await fn(loc); cache[id] = { at: Date.now(), data }; return data;
}
function index(fc, arch, ens){
  const today = fc.current.time.slice(0,10);
  const days = { ...(arch ? indexSource(arch, 'hist') : {}) };
  Object.assign(days, indexSource(fc, 'fc'));
  if (ens){ const last = Object.keys(days).sort().at(-1); Object.assign(days, indexEnsemble(ens, nextKey(last), isoDay(parseKey(today), 30))); }   // weather for the next 30 days
  if (params.get('demo') === 'winter') winterDemo(days, today);
  for (const k in days) days[k].frost = days[k].tmin != null && days[k].tmin <= 0;
  const ks = Object.keys(days).sort(); S.minKey = ks[0]; S.maxKey = ks.at(-1);
  return days;
}
// Design-review helper: paints a cold snap onto the coming days so winter states can be reviewed outside winter.
function winterDemo(days, today){
  const plan = [ [5,71,0.8,2,-1,60], [6,73,3.5,0,-3,85], [7,75,11,-2,-6,95], [8,86,6,-3,-7,80], [9,0,0,-1,-9,0], [10,45,0,-2,-6,10], [11,66,0,1,-2,70], [13,85,1.6,0,-3,55], [14,3,0,-1,-4,10] ];
  const d0 = parseKey(today);
  plan.forEach(([off,code,snow,tmax,tmin,pp]) => {
    const t = new Date(d0); t.setUTCDate(t.getUTCDate()+off); const k = t.toISOString().slice(0,10), d = days[k]; if (!d) return;
    Object.assign(d, { code, c:cat(code), sev:sevOf(code), snow, tmax, tmin, pprob:pp, psum: snow ? snow/1.2 : (code===66?3.2:0) });
    d.hours.forEach((h,i) => { const daytime = i>=8 && i<=16; h.code = (code===0||code===3) ? (daytime?code:(code===0?0:3)) : (i%5===0 ? 3 : code); h.temp = tmin + (tmax-tmin)*Math.max(0,Math.sin(Math.PI*(i-6)/12)); h.pp = code===0||code===3 ? 0 : Math.max(10, pp - Math.abs(14-i)*3); });
  });
}
async function load(loc){
  S.loc = loc;
  const [fc, arch, ens] = await Promise.allSettled([fetchWeather(loc), cached('arch', loc, fetchArchive), cached('ens', loc, fetchEnsemble)]);
  if (fc.status !== 'fulfilled'){ toast('Could not load weather. Check your connection.'); return; }
  S.data = fc.value;
  S.raw = { arch: arch.value, ens: ens.value };
  S.days = index(S.data, arch.value, S.set.outlook ? ens.value : null);
  if (arch.status !== 'fulfilled' || ens.status !== 'fulfilled') toast(arch.status !== 'fulfilled' ? 'Past-year history is unavailable right now.' : 'The 1-month outlook is unavailable right now.');
  S.todayKey = S.data.current.time.slice(0,10);
  if (!S.view){ const t = parseKey(S.todayKey); S.view = { y:t.getUTCFullYear(), m:t.getUTCMonth() };
    if (SNAP && params.get('month')) { const [yy, mm] = params.get('month').split('-').map(Number); S.view = { y:yy, m:mm-1 }; } }
  if (!SNAP) store.set('wc.loc', loc);
  applyTheme(); render();
  await refreshSummaries();
  $('#loading').classList.add('gone');
}

/* ---------- Theme from sunrise / sunset ---------- */
function isDaylight(){
  if (!S.data) { const h = new Date().getHours(); return h >= 7 && h < 18; }
  const now = localNowIso(), today = S.days[now.slice(0,10)];
  if (!today) return !!S.data.current.is_day;
  return now >= today.sunrise && now < today.sunset;
}
function applyTheme(){
  const day = isDaylight();
  const theme = S.themePref === 'auto' ? (day ? 'light' : 'dark') : S.themePref;
  document.documentElement.dataset.theme = theme;
  const today = S.data && S.days[localNowIso()?.slice(0,10)];
  const next = !today ? '' : day ? `sunset ${hm(today.sunset)}` : (localNowIso() < today.sunrise ? `sunrise ${hm(today.sunrise)}` : `sunrise ${hm(S.days[nextKey(today.key)]?.sunrise)}`);
  const modeName = S.themePref === 'auto' ? (day ? 'Day' : 'Night') : (S.themePref === 'light' ? 'Light' : 'Dark');
  const dot = theme === 'light'
    ? `<span class="dot" style="background:var(--yellow)"></span>`
    : `<span class="dot"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2 A10 10 0 0 0 12 22 Z" fill="var(--yellow)"/></svg></span>`;
  $('#modeChip').innerHTML = `${dot}<span>${modeName}${S.themePref==='auto'?' mode':' · manual'}</span>${S.themePref==='auto' && next ? `<em>${next}</em>` : `<em>tap for auto</em>`}`;
}
const nextKey = k => { const d = parseKey(k); d.setUTCDate(d.getUTCDate()+1); return d.toISOString().slice(0,10); };
const prevKey = k => { const d = parseKey(k); d.setUTCDate(d.getUTCDate()-1); return d.toISOString().slice(0,10); };

/* ---------- Render: header + month ---------- */
function render(){
  const {y,m} = S.view;
  $('#monthTitle').innerHTML = `${MONTHS[m]} <span>${y}</span>`;
  $('#prevBtn').disabled = !S.minKey || keyOf(y,m,1) <= S.minKey;
  const tk = S.todayKey ? parseKey(S.todayKey) : null;   // calendar reaches 100 years ahead; weather only where data exists
  $('#nextBtn').disabled = !tk || (y*12 + m) >= (tk.getUTCFullYear() + 100)*12 + tk.getUTCMonth();
  const dows = ['MON','TUE','WED','THU','FRI','SAT','SUN']; if (S.set.week === 'sun') dows.unshift(dows.pop());
  $('#dow').innerHTML = dows.map(d => `<div>${d}</div>`).join('');
  document.querySelectorAll('#unitSeg button').forEach(b => b.classList.toggle('on', b.dataset.u === S.unit));
  renderSide(); renderGrid();
  if (S.selected) renderFocus();
}

          <span class="c"><span>${dayShort(day)}</span>${day.snow >= 0.1 ? `<span class="s">${day.snow < 10 ? day.snow.toFixed(1) : Math.round(day.snow)} cm</span>`
            : (day.pprob>=20 || (past && day.psum>=0.5)) ? `<span class="p">${past ? ((day.psum ?? 0).toFixed(1)+' mm') : day.pprob+'%'}</span>`

/* ---------- Focus view ---------- */
function openFocus(k){ S.selected = k; renderGrid(); renderFocus(); $('#focus').classList.add('open'); if(!SNAP) history.replaceState(null,'',`#${k}`); }
function closeFocus(){ S.selected = null; $('#focus').classList.remove('open'); renderGrid(); if(!SNAP) history.replaceState(null,'',location.pathname+location.search); }
function chart(day){
  const hs = day.hours; if (!hs.length) return '';
  const W = 720, H = 230, top = 58, bot = 170, step = W/24;
  const temps = hs.map(h=>tconv(h.temp)); const lo = Math.min(...temps), hi = Math.max(...temps), span = (hi-lo)||1;
  const yOf = t => bot - 14 - (t-lo)/span*(bot-top-34);
  const pts = hs.map((h,i)=>[step*i+step/2, yOf(tconv(h.temp))]);
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = line + ` L${pts.at(-1)[0].toFixed(1)} ${bot} L${pts[0][0].toFixed(1)} ${bot} Z`;
  const now = localNowIso(); const nowH = day.key === now.slice(0,10) ? +now.slice(11,13) + +now.slice(14,16)/60 : null;
  const iMax = temps.indexOf(Math.max(...temps)), iMin = temps.indexOf(Math.min(...temps));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Hourly temperature and chance of rain">`;
  // sunlight band
  const toH = iso => +iso.slice(11,13) + +iso.slice(14,16)/60;
  s += `<rect x="${toH(day.sunrise)*step}" y="${top-6}" width="${(toH(day.sunset)-toH(day.sunrise))*step}" height="${bot-top+6}" fill="var(--yellow)" opacity=".12"/>`;
  s += `<path d="${area}" fill="var(--ink)" opacity=".05"/><path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>`;
  hs.forEach((h,i)=>{ const x = step*i+step/2;
    const pv = h.pp ?? (h.mm ? Math.min(100, h.mm*40) : 0);
    if (pv) s += `<rect x="${x-step*0.32}" y="${H-28-pv*0.32}" width="${step*0.64}" height="${pv*0.32}" fill="var(--blue)" opacity="${.35+pv/160}"/>`;
    if (i%3===0){
      s += `<g transform="translate(${x-13} 4)"><svg width="26" height="26" viewBox="0 0 100 100">${icon(cat(h.code), !!h.day, sevOf(h.code)).replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg></g>`;
      s += `<text x="${x}" y="${H-6}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="Jost, sans-serif">${S.set.time === '24' ? pad(i) : (i % 12 || 12) + (i < 12 ? 'a' : 'p')}</text>`;
      s += `<text x="${x}" y="${pts[i][1]-12}" text-anchor="middle" font-size="13" font-weight="500" fill="var(--ink)" font-family="Jost, sans-serif">${Math.round(temps[i])}°</text>`;
    }
  });
  s += `<circle cx="${pts[iMax][0]}" cy="${pts[iMax][1]}" r="5" fill="var(--red)"/><circle cx="${pts[iMin][0]}" cy="${pts[iMin][1]}" r="5" fill="var(--blue)"/>`;
  if (nowH != null){ const x = nowH*step; s += `<line x1="${x}" y1="${top-6}" x2="${x}" y2="${H-24}" stroke="var(--red)" stroke-width="2"/><rect x="${x-18}" y="${top-24}" width="36" height="16" rx="8" fill="var(--red)"/><text x="${x}" y="${top-12}" text-anchor="middle" font-size="10" font-weight="600" fill="#fff" font-family="Jost, sans-serif">NOW</text>`; }
  s += `<line x1="0" y1="${H-24}" x2="${W}" y2="${H-24}" stroke="var(--line)" stroke-width="1"/></svg>`;
  return s;
}
function spreadChart(day){
  const W = 720, H = 210, tx = day.members.tx.map(tconv), tn = day.members.tn.map(tconv);
  const lo = Math.floor(Math.min(...tn)) - 1, hi = Math.ceil(Math.max(...tx)) + 1, x = t => 70 + (t - lo) / (hi - lo) * (W - 100);
  const mean = a => a.reduce((p,q) => p+q, 0) / a.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spread of ${day.runs} model runs for high and low temperature">`;

        ${stat('Range', tr('var(--red)'), Math.round(tconv(day.tmax)-tconv(day.tmin)), '°', `From ${T(day.tmin)} to ${T(day.tmax)}`)}
      </div>
    </section>`;
}

async function reverseName(lat, lon){
  try {
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
    const j = await r.json(); return { name: j.city || j.locality || 'My location', region: j.countryName || '' };
  } catch(e){ return { name:'My location', region:'' }; }
}
const FALLBACK = { lat:52.52, lon:13.405, name:'Berlin', region:'Germany' };
async function locate(){
  if (params.get('lat')) return load({ lat:+params.get('lat'), lon:+params.get('lon'), name:params.get('name')||'Location', region:params.get('region')||'' });
  const saved = store.get('wc.loc');
  if (SNAP) return load(FALLBACK);
  await load(saved || S.saved[0] || FALLBACK);
  if (!saved && !S.saved.length && navigator.geolocation){
    navigator.geolocation.getCurrentPosition(async p => {
      const {latitude:lat, longitude:lon} = p.coords; const n = await reverseName(lat, lon);
      S.view = null; load({ lat, lon, ...n });
    }, () => {}, { timeout:8000 });
  }
}

const toLoc = x => ({ lat:x.latitude, lon:x.longitude, name:x.name, region:x.country || '' });

      <div class="tags">${i === 0 ? '<span class="tag home">Home</span>' : ''}${cur ? '<span class="tag now">Viewing</span>' : ''}<span class="tag">${s ? `${s.time} · ${s.day ? 'Day' : 'Night'}` : '…'}</span>
        <span class="pact">${i ? `<button data-home="${i}" title="Make home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></svg>Home</button>` : ''}<button data-rm="${i}" title="Remove ${l.name}"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span></div>
    </div>`; }).join('');
  $('#psheet').classList.remove('scrolled');
  $('#psheet').innerHTML = `<div class="ph"><div><div class="label">Your places · ${S.saved.length}</div><h2>Saved locations</h2><p>Each card follows its own sunrise and sunset: light by day, dark by night.</p></div>
      <button class="btn" data-add>+ Add place</button><button class="icon-btn close" data-close-places aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="pgrid">${cards}<button class="pcard padd" data-add><span class="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>Add a place</button></div>`;
}
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-sw-close]')) { S.switcher = false; renderSide(); return; }
  if (t.closest('#locSwitch')) { S.switcher = !S.switcher; renderSide(); return; }
  if (t.closest('[data-save]')) { isSaved(S.loc) ? unsaveLoc(S.loc) : saveLoc(S.loc); return; }
  const rm = t.closest('[data-rm]'); if (rm) { unsaveLoc(S.saved[+rm.dataset.rm]); return; }
  const hm_ = t.closest('[data-home]'); if (hm_) { makeHome(+hm_.dataset.home); return; }
  const lc = t.closest('[data-loc]'); if (lc) { switchTo(S.saved[+lc.dataset.loc]); return; }
  if (t.closest('[data-add]')) { S.switcher = false; closePlaces(); renderSide(); $('#searchInput').focus(); return; }
  if (t.closest('[data-open-places]')) { document.querySelector('.toast')?.remove(); openPlaces(); return; }
  if (t.closest('[data-close-places]') || t.id === 'places') { closePlaces(); return; }
  if (S.switcher && !t.closest('.switcher')) { S.switcher = false; renderSide(); }
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('#results').hidden = true; });

/* ---------- Events ---------- */
$('#prevBtn').onclick = () => { if ($('#prevBtn').disabled) return; let {y,m} = S.view; m--; if(m<0){m=11;y--;} S.view={y,m}; render(); };
$('#nextBtn').onclick = () => { if ($('#nextBtn').disabled) return; let {y,m} = S.view; m++; if(m>11){m=0;y++;} S.view={y,m}; render(); };
$('#todayBtn').onclick = () => { const t = parseKey(S.todayKey); S.view = { y:t.getUTCFullYear(), m:t.getUTCMonth() }; render(); };
$('#unitSeg').onclick = e => { const b = e.target.closest('button'); if(!b) return; S.unit = b.dataset.u; store.set('wc.unit', S.unit); render(); };
$('#modeChip').onclick = () => { S.themePref = { auto:'light', light:'dark', dark:'auto' }[S.themePref]; store.set('wc.theme', S.themePref); applyTheme(); if ($('#settings').classList.contains('open')) renderSettings(); };
document.addEventListener('click', e => {
  const c = e.target.closest('[data-k]'); if (c && !e.target.closest('.sheet')) return openFocus(c.dataset.k);
  const g = e.target.closest('[data-go]'); if (g && !g.disabled) { S.selected = g.dataset.go; const d = parseKey(S.selected); S.view = { y:d.getUTCFullYear(), m:d.getUTCMonth() }; return render(); }
  if (e.target.closest('[data-close]') || e.target.id === 'focus') closeFocus();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.searchOpen){ closeSearchSheet(); return; }
  if (e.key === 'Escape' && S.fontOpen){ S.fontOpen = false; renderSettings(); $('#fontSel')?.focus(); return; }
  if (e.key === 'Escape' && $('#settings').classList.contains('open')) return closeSettings();
  if (e.key === 'Escape' && $('#places').classList.contains('open')) return closePlaces();
  if (e.key === 'Escape' && S.switcher) { S.switcher = false; return renderSide(); }
  if (!S.selected) { if (e.key === 'Enter' && e.target.closest?.('.now')) openFocus(S.todayKey); return; }
  if (e.key === 'Escape') closeFocus();
  const go = e.key === 'ArrowRight' ? nextKey(S.selected) : e.key === 'ArrowLeft' ? prevKey(S.selected) : null;
  if (go && S.days[go]) { S.selected = go; const d = parseKey(go); S.view = { y:d.getUTCFullYear(), m:d.getUTCMonth() }; render(); }
});
function toast(msg){ document.querySelector('.toast')?.remove(); const t = document.createElement('div'); const rich = msg.startsWith('<'); t.className = rich ? 'toast' : 'err'; t[rich ? 'innerHTML' : 'textContent'] = msg; t.setAttribute('role','status'); document.body.append(t); if (!SNAP) setTimeout(()=>t.remove(), 5000); }

// Live: re-check theme each minute, refresh data every 15 minutes
setInterval(() => { if (S.data) { applyTheme(); renderSide(); } }, 60*1000);
setInterval(() => { if (S.loc && !SNAP) load(S.loc); }, 15*60*1000);

/* ---------- Phone app UI: tabs, sheets, scrim, drag to dismiss (only active at ≤640px) ---------- */
function isPhone(){ return matchMedia('(max-width:640px)').matches; }
if (isPhone()){ const vp = document.querySelector('meta[name="viewport"]'); if (vp && !vp.content.includes('viewport-fit')) vp.content += ', viewport-fit=cover'; }
function syncScrim(){ const s = $('#scrim'); if (s) s.hidden = !(isPhone() && (S.switcher || S.searchOpen)); }
function updateTabbar(){
  const settingsOpen = $('#settings').classList.contains('open');
  document.querySelectorAll('#tabbar [data-tab]').forEach(b => b.setAttribute('aria-current', (settingsOpen ? b.dataset.tab === 'settings' : b.dataset.tab === S.tab) ? 'page' : 'false'));
}
function setTab(t, scroll = true){
  S.tab = t; const h = document.documentElement;
  h.classList.toggle('tab-info', t === 'info'); h.classList.toggle('tab-home', t !== 'info');
  if (t === 'info' && S.switcher){ S.switcher = false; renderSide(); }
  updateTabbar(); if (scroll) window.scrollTo(0, 0);
}
$('#tabbar').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  if (b.dataset.tab === 'settings'){ openSettings(); updateTabbar(); return; }
  if ($('#settings').classList.contains('open')) closeSettings();
  if (b.dataset.tab === S.tab) window.scrollTo({ top: 0, behavior: 'smooth' }); else setTab(b.dataset.tab);
});
setTab('home', false);
function openSearchSheet(){
  if (!isPhone() || S.searchOpen) return;
  S.searchOpen = true; if (S.switcher){ S.switcher = false; renderSide(); }
  document.documentElement.classList.add('search-open'); syncScrim();
}
function closeSearchSheet(){
  if (!S.searchOpen) return;
  S.searchOpen = false; document.documentElement.classList.remove('search-open');
  clearTimeout(st); $('#searchInput').value = ''; lastResults = []; $('#results').hidden = true; syncClear(); $('#searchInput').blur(); syncScrim();
}
$('#searchInput').addEventListener('focus', openSearchSheet);
$('#searchClose').addEventListener('click', closeSearchSheet);
$('#scrim').addEventListener('click', () => { if (S.searchOpen) closeSearchSheet(); else if (S.switcher){ S.switcher = false; renderSide(); } });
// lock page scroll behind the big sheets
new MutationObserver(() => document.documentElement.classList.toggle('sheet-lock', isPhone() && !!document.querySelector('.focus.open')))
  .observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class'] });
// Drag a sheet's top bar down to dismiss it
(() => {
  const GRIPS = '.sheet .dhead, .psheet .ph, .ssheet .snav, .switcher .sw-h, .search-open .search';
  let drag = null;
  document.addEventListener('pointerdown', e => {
    if (!isPhone() || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const grip = e.target.closest(GRIPS); if (!grip) return;
    if (grip.matches('.search') && e.target.closest('input,.results,button')) return;     // typing / scrolling results still works
    drag = { sheet: grip.closest('.sheet,.psheet,.ssheet,.switcher,.search'), y: e.clientY, dy: 0, id: e.pointerId };
  });
  document.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    drag.dy = Math.max(0, e.clientY - drag.y);
    if (drag.dy > 6){ drag.sheet.style.transition = 'none'; drag.sheet.style.transform = `translateY(${drag.dy}px)`; }
  });
  const end = () => {
    if (!drag) return; const { sheet, dy } = drag; drag = null;
    sheet.style.transition = ''; sheet.style.transform = '';
    if (dy <= 110) return;
    if (sheet.matches('.sheet')) closeFocus(); else if (sheet.matches('.psheet')) closePlaces();
    else if (sheet.matches('.ssheet')) closeSettings(); else if (sheet.matches('.switcher')){ S.switcher = false; renderSide(); }
    else closeSearchSheet();
  };
  document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
})();
matchMedia('(max-width:640px)').addEventListener?.('change', () => { if (!isPhone()){ closeSearchSheet(); document.documentElement.classList.remove('sheet-lock'); } syncScrim(); });

applyTheme();
locate().then(async () => {
  if (params.get('date') && S.days[params.get('date')]) openFocus(params.get('date'));
  if (!SNAP) return;
  const ui = params.get('ui');
  if (ui === 'switcher') { S.switcher = true; renderSide(); }
  if (ui === 'search') { $('#searchInput').value = params.get('q'); $('#searchInput').setAttribute('value', params.get('q')); syncClear(); $('#searchInput').focus(); await doSearch(params.get('q')); }
  if (ui === 'saved') saveLoc(S.loc);
  if (ui === 'places') openPlaces();
  if (ui === 'settings') openSettings(params.get('tab') || 'general');
  // Snapshot export: lift popovers to the top layer so static design imports keep their stacking.
  if (params.has('lift')) document.querySelectorAll('.switcher, #results:not([hidden])').forEach(el => {
    const r = el.getBoundingClientRect();
    el.style.cssText += `;position:absolute;left:${r.left}px;top:${r.top}px;width:${r.width}px;right:auto;z-index:300`;
    document.body.append(el);
  });
});
if (!SNAP && location.hash.length === 11) { const k = location.hash.slice(1); const iv = setInterval(()=>{ if(S.data){ clearInterval(iv); if(S.days[k]) openFocus(k);} },100); }
})();
</script>
</body>
</html>
